name: Test and Deploy

# Approach A: Coolify builds the images from Git. This workflow runs the test
# suite on GitHub-hosted runners (no self-hosted runner, no image build/push),
# and on green triggers Coolify's deploy webhook — which is what makes the tests
# a gate. Turn OFF Coolify's native auto-deploy so this is the only trigger.

on:
  push:
    branches: ["main", "staging"]
    paths:
      - "backend/**"
      - "frontend/**"
      - "strategy-engine/**"
      - "docker-compose.coolify.yml"
      - ".github/workflows/**"
  pull_request:
    branches: ["main", "staging"]
    paths:
      - "backend/**"
      - "frontend/**"
      - "strategy-engine/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            runtime: node
          - service: strategy-engine
            runtime: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: matrix.runtime == 'node'
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install & test (node)
        if: matrix.runtime == 'node'
        run: |
          cd ${{ matrix.service }}
          npm ci --legacy-peer-deps
          npm test

      - uses: actions/setup-python@v5
        if: matrix.runtime == 'python'
        with:
          python-version: "3.11"

      - name: Install & test (python)
        if: matrix.runtime == 'python'
        run: |
          cd ${{ matrix.service }}
          if [[ -f requirements.txt ]]; then python -m pip install -r requirements.txt; fi
          python -m unittest discover -s . -p 'test_*.py'

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Trigger Coolify build + deploy
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            UUID="${{ secrets.COOLIFY_PROD_UUID }}"
          else
            UUID="${{ secrets.COOLIFY_STAGING_UUID }}"
          fi
          curl --fail-with-body -X GET \
            "${{ secrets.COOLIFY_URL }}/api/v1/deploy?uuid=$UUID&force=true" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}"
