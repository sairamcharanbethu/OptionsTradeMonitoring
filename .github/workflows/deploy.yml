name: Build and Deploy

on:
  push:
    branches: ["main", "staging"]
  pull_request:
    branches: ["main", "staging"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
            runtime: node
          - service: frontend
            context: ./frontend
            runtime: node
          - service: strategy-engine
            context: ./strategy-engine
            runtime: python
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - uses: actions/setup-node@v4
        if: matrix.runtime == 'node'
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ${{ matrix.context }}/package-lock.json

      - uses: actions/setup-python@v5
        if: matrix.runtime == 'python'
        with:
          python-version: "3.11"

      - name: Install dependencies, test, and build
        if: matrix.runtime == 'node'
        run: |
          cd ${{ matrix.context }}
          npm ci --legacy-peer-deps
          if [[ "${{ matrix.service }}" == "backend" ]]; then npm test; fi
          npm run build
        env:
          VITE_APP_BUILD_SHA: ${{ github.sha }}

      - name: Test strategy engine
        if: matrix.runtime == 'python'
        run: |
          cd ${{ matrix.context }}
          python -m pip install -r requirements.txt
          python -m unittest discover -s . -p 'test_*.py'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert repository name to lowercase
        id: repo
        run: echo "lowercase=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.lowercase }}-${{ matrix.service }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=sha
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Cleanup workspace
        if: always()
        run: |
          sudo rm -rf "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.* 2>/dev/null || true

  deploy:
    needs: build
    runs-on: self-hosted
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          sparse-checkout: |
            docker-compose.yml
          sparse-checkout-cone-mode: false

      - name: Set deployment environment variables
        id: set-env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "DEPLOY_PATH=/srv/ssmedia/docker/OptionsTradeMonitoring" >> $GITHUB_ENV
            echo "COMPOSE_PROJECT_NAME=options-monitor-prod" >> $GITHUB_ENV
            echo "ENV_NAME=Production" >> $GITHUB_ENV
            echo "PORT_BACKEND=3001" >> $GITHUB_ENV
            echo "PORT_FRONTEND=8100" >> $GITHUB_ENV
            echo "PORT_DB=5432" >> $GITHUB_ENV
            echo "PORT_REDIS=6379" >> $GITHUB_ENV
            echo "INFISICAL_ENV=prod" >> $GITHUB_ENV
          else
            echo "DEPLOY_PATH=/srv/ssmedia/docker/OptionsTradeMonitoring-staging" >> $GITHUB_ENV
            echo "COMPOSE_PROJECT_NAME=options-monitor-staging" >> $GITHUB_ENV
            echo "ENV_NAME=Staging" >> $GITHUB_ENV
            echo "PORT_BACKEND=30020" >> $GITHUB_ENV
            echo "PORT_FRONTEND=8200" >> $GITHUB_ENV
            echo "PORT_DB=5432" >> $GITHUB_ENV
            echo "PORT_REDIS=46380" >> $GITHUB_ENV
            echo "INFISICAL_ENV=staging" >> $GITHUB_ENV
          fi

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" | sed 's/\\n/\n/g' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          # Copy compose file
          scp -i ~/.ssh/deploy_key docker-compose.yml ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:${{ env.DEPLOY_PATH }}/

          # Deploy via SSH
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} "INFISICAL_TOKEN='${{ secrets.INFISICAL_TOKEN }}' ENV_NAME='${{ env.ENV_NAME }}' DEPLOY_PATH='${{ env.DEPLOY_PATH }}' COMPOSE_PROJECT_NAME='${{ env.COMPOSE_PROJECT_NAME }}' PORT_BACKEND='${{ env.PORT_BACKEND }}' PORT_FRONTEND='${{ env.PORT_FRONTEND }}' PORT_DB='${{ env.PORT_DB }}' PORT_REDIS='${{ env.PORT_REDIS }}' INFISICAL_ENV='${{ env.INFISICAL_ENV }}' IMAGE_TAG='${{ github.sha }}' INFISICAL_API_URL='https://cred.ssmedia.ca' bash -s" << 'DEPLOY_SCRIPT'
            set -e
            cd ${{ env.DEPLOY_PATH }}
            
            # Export secrets from Infisical into .env file
            infisical export --projectId=d35df18b-133e-4eb2-a956-6cad1f5c587d --env=${INFISICAL_ENV} --format=dotenv > .env
            
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            docker compose -p ${{ env.COMPOSE_PROJECT_NAME }} pull trade-staging-backend trade-staging-frontend zerogex-prefetch zerogex-prefetch-qqq strategy-engine
            
            export PORT_BACKEND=${{ env.PORT_BACKEND }}
            export PORT_FRONTEND=${{ env.PORT_FRONTEND }}
            export PORT_DB=${{ env.PORT_DB }}
            export PORT_REDIS=${{ env.PORT_REDIS }}
            export IMAGE_TAG=${{ github.sha }}

            if [[ -n "${PAPER_LEGACY_DATABASE_URL:-}" ]]; then
              echo "[Migration] Importing the legacy paper ledger before starting the new backend."
              docker compose -p ${{ env.COMPOSE_PROJECT_NAME }} stop trade-staging-backend || true
              docker compose -p ${{ env.COMPOSE_PROJECT_NAME }} run --rm --no-deps trade-staging-backend npm run migrate:shared-paper -- --apply
            fi
            
            if [[ "${{ env.ENV_NAME }}" == "Production" ]]; then
              docker compose -p ${{ env.COMPOSE_PROJECT_NAME }} up -d --wait --wait-timeout 180 --no-deps trade-staging-backend trade-staging-frontend db trade-staging-redis zerogex-prefetch zerogex-prefetch-qqq strategy-engine
            else
              docker compose -p ${{ env.COMPOSE_PROJECT_NAME }} stop db || true
              docker compose -p ${{ env.COMPOSE_PROJECT_NAME }} rm -f db || true
              docker compose -p ${{ env.COMPOSE_PROJECT_NAME }} up -d --wait --wait-timeout 180 --remove-orphans --no-deps trade-staging-backend trade-staging-frontend trade-staging-redis zerogex-prefetch zerogex-prefetch-qqq strategy-engine
            fi

            docker compose -p ${{ env.COMPOSE_PROJECT_NAME }} ps
            docker image prune -f
          DEPLOY_SCRIPT

      - name: Cleanup workspace
        if: always()
        run: |
          sudo rm -rf "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.* 2>/dev/null || true
