server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Build assets carry a content hash in the filename, so they can be cached
    # forever — a changed file is a changed URL.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must NOT be cached. It is the only file whose URL stays the
    # same across deploys, so a cached copy pins the browser to the previous
    # build's asset hashes and the deploy silently does not land until someone
    # hard-reloads.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        expires off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://trade-staging-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
