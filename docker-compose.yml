services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${PORT_DB:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - ssmedia_ssmedia_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  trade-staging-backend:
    image: ghcr.io/sairamcharanbethu/optionstrademonitoring-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${PORT_BACKEND:-3001}:3001"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL}
      BACKUP_DATABASE_URL: ${BACKUP_DATABASE_URL}
      REDIS_URL: redis://trade-staging-redis:6379
      JWT_SECRET: ${JWT_SECRET}
      PORT: ${PORT}
      N8N_ALERT_WEBHOOK_URL: ${N8N_ALERT_WEBHOOK_URL}
      MARKET_DATA_POLL_INTERVAL: ${MARKET_DATA_POLL_INTERVAL}
      SNAPTRADE_PENDING_SYNC_INTERVAL_SECONDS: ${SNAPTRADE_PENDING_SYNC_INTERVAL_SECONDS:-60}
      SMART_STOP_CONFIRMATION_MS: ${SMART_STOP_CONFIRMATION_MS:-45000}
      ENABLE_DEV_TRADING_TESTS: ${ENABLE_DEV_TRADING_TESTS:-false}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      AI_MODEL: ${AI_MODEL:-deepseek/deepseek-chat}
      MORNING_BRIEFING_SCHEDULE: ${MORNING_BRIEFING_SCHEDULE:-30 8 * * *}
      IBKR_HOST: ${IBKR_HOST:-ib_gateway}
      IBKR_PORT: ${IBKR_PORT:-4003}
      IBKR_CLIENT_ID_MARKET_DATA: ${IBKR_CLIENT_ID_MARKET_DATA:-21}
      IBKR_CLIENT_ID_STREAM: ${IBKR_CLIENT_ID_STREAM:-22}
      IBKR_MARKET_DATA_TYPE: ${IBKR_MARKET_DATA_TYPE:-1}
      STRATEGY_DATA_DIR: /strategy-data/trade
      STRATEGY_MAX_TOTAL_DEBIT_DOLLARS: ${STRATEGY_MAX_TOTAL_DEBIT_DOLLARS:-500}
      STRATEGY_PREFERRED_CONTRACTS: ${STRATEGY_PREFERRED_CONTRACTS:-1}
      STRATEGY_MAX_CONTRACTS: ${STRATEGY_MAX_CONTRACTS:-1}
      VIX_TERM_STRUCTURE_MIN_RATIO: ${VIX_TERM_STRUCTURE_MIN_RATIO:-1.05}
    volumes:
      - strategy-data:/strategy-data
    depends_on:
      db:
        condition: service_healthy
      trade-staging-redis:
        condition: service_healthy
    networks:
      - ssmedia_ssmedia_net
      - default
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5

  trade-staging-redis:
    image: redis:alpine
    restart: always
    ports:
      - "${PORT_REDIS:-6379}:6379"
    networks:
      - default
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zerogex-prefetch:
    build:
      context: ./strategy-engine
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ZEROGEX_API_KEY: ${ZEROGEX_API_KEY}
    volumes:
      - strategy-data:/data
    command:
      - python3
      - zerogex_prefetch_service.py
      - --symbol
      - SPY
      - --mode
      - primary
      - --output-file
      - /data/trade/zerogex.json
      - --health-file
      - /data/trade/zerogex-health.json
      - --interval
      - "5"
      - --context-interval
      - "15"
      - --deep-interval
      - "30"
      - --timeout
      - "10"
    networks:
      - default

  strategy-engine:
    build:
      context: ./strategy-engine
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - strategy-data:/data
    command:
      - python3
      - trade_prefetch_service.py
      - --host
      - ${IBKR_HOST:-ib_gateway}
      - --port
      - ${IBKR_PORT:-4003}
      - --client-id
      - ${IBKR_CLIENT_ID_STRATEGY:-23}
      - --symbols
      - SPY
      - --data-type
      - ${STRATEGY_IBKR_DATA_TYPE:-live}
      - --primary-gex-source
      - zerogex
      - --sscgex-enabled
      - "false"
      - --zerogex-enabled
      - "true"
      - --zerogex-structure-context
      - "true"
      - --zerogex-flow-context
      - "true"
      - --zerogex-session-levels
      - "true"
      - --zerogex-late-day-forced-flow
      - "true"
      - --local-gex-fallback
      - "false"
      - --option-max-total-debit-dollars
      - ${STRATEGY_MAX_TOTAL_DEBIT_DOLLARS:-500}
      - --option-preferred-contracts
      - ${STRATEGY_PREFERRED_CONTRACTS:-1}
      - --option-max-otm-steps
      - "6"
      - --option-min-abs-delta
      - "0.15"
      - --option-max-spread-pct
      - "5"
      - --paper-exit-target
      - "2"
      - --same-side-reentry-cooldown-seconds
      - "900"
      - --max-tracking-gap-seconds
      - "30"
      - --output-dir
      - /data/trade
      - --policy-file
      - /data/trade/policy.json
      - --gex-file
      - /data/disabled-sscgex.json
      - --heatmap-file
      - /data/disabled-heatmap.json
      - --zerogex-file
      - /data/trade/zerogex.json
      - --interval
      - "0.25"
    depends_on:
      zerogex-prefetch:
        condition: service_started
    networks:
      - ssmedia_ssmedia_net
      - default

  trade-staging-frontend:
    image: ghcr.io/sairamcharanbethu/optionstrademonitoring-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_APP_VERSION: ${VITE_APP_VERSION:-1.4.1}
        VITE_APP_BUILD_SHA: ${VITE_APP_BUILD_SHA:-}
        VITE_ENABLE_DEV_TRADING_TESTS: ${VITE_ENABLE_DEV_TRADING_TESTS:-false}
    restart: always
    ports:
      - "${PORT_FRONTEND:-3000}:80"
    depends_on:
      trade-staging-backend:
        condition: service_healthy
    networks:
      - ssmedia_ssmedia_net
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

networks:
  ssmedia_ssmedia_net:
    external: true

volumes:
  db-data:
  strategy-data:
