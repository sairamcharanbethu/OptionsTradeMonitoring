# =============================================================================
# Coolify deployment compose — Approach A (Coolify builds from Git)
# =============================================================================
# Coolify BUILDS the three service images itself from this repo on each deploy
# (Docker Compose build pack) and starts them. There is NO CI: Coolify's GitHub
# App auto-deploys on every push to the connected branch — build + deploy happen
# entirely in Coolify. Tests are run locally before committing. (The `image:`
# tags are just local build tags; nothing is pulled from GHCR.)
#
# WHAT CHANGED vs docker-compose.yml (and WHY):
#   1. `build:` kept, external network/host -> Coolify builds each service from
#      ports/Infisical dropped                its context; the rest is Coolify-
#                                             native (see below).
#   2. Host `ports:` removed on db/redis/ -> services talk by name on the
#      backend                               internal network; also avoids
#                                            staging<->prod host-port clashes
#                                            when both run on one Coolify host.
#   3. frontend exposed via SERVICE_FQDN  -> Coolify assigns a domain + Traefik
#      instead of a published port           route + Let's Encrypt TLS. The var
#                                            is SERVICE_FQDN_<SERVICE_NAME> and
#                                            the name must match the compose
#                                            service (hyphens -> underscores), or
#                                            the domain is generated but attached
#                                            to nothing. No hyphens in the key:
#                                            Coolify's validator rejects them.
#   4. backend gets extra_hosts           -> keeps OLLAMA_URL host.docker.internal
#                                            working on a Linux Coolify host.
#   5. Service NAMES kept identical       -> nginx upstream (trade-staging-backend)
#                                            and REDIS_URL (trade-staging-redis)
#                                            must not change.
#   6. ${VAR} interpolation kept          -> fill these in Coolify's Environment
#                                            Variables panel (replaces Infisical
#                                            export). IMAGE_TAG defaults to latest.
#
# PREREQUISITES in Coolify (one-time):
#   - Resource = Docker Compose linked to this Git repo + branch; build pack
#     builds from this file. Install the Coolify GitHub App and ENABLE auto-deploy
#     so every push to the branch triggers a build + deploy (no CI involved).
#   - Mark NODE_ENV as RUNTIME-only (not build-time) in the Coolify env, or the
#     backend/frontend build stages skip devDependencies and the build fails.
#   - IB Gateway runs as a container that PUBLISHES 4001 (live) / 4002 (paper)
#     to the host. The Coolify stack is on an isolated network and cannot resolve
#     ib_gateway, so it reaches the gateway via the published host port:
#     host.docker.internal:4001 (extra_hosts host-gateway on backend + engine) —
#     NOT 127.0.0.1, which is the container's own loopback. The host gateway must
#     accept connections from the docker bridge (uncheck "localhost only" and add
#     the bridge subnet to Trusted IPs in the IB Gateway API settings).
#   - Only ONE stack may hold the IBKR client IDs (backend 21/22, engine 23) at a
#     time — stop the old options-monitor-staging stack before running this one.
#   - Set all environment variables in the Coolify UI (bulk-paste your .env).
#     Do NOT set PORT — nginx.conf and the backend healthcheck both hardcode 3001.
#   - Turn ON "Preserve Repository During Deployment" (Configuration > General).
#     The db service bind-mounts ./db/schema.sql from the checkout; without this
#     the path is missing at start and Docker substitutes an empty directory.
#   - Set the domain on the trade-staging-frontend service in the Coolify UI
#     (Configuration > Domains). The magic var above generates a sslip.io-style
#     default; the UI field is what pins your real hostname, and it is also the
#     version-independent way to get the Traefik router created.
# =============================================================================

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # No host `ports:` — reached internally as db:5432. Expose via a Coolify
    # database resource only if you need external access.
    volumes:
      - db-data:/var/lib/postgresql/data
      # schema.sql only runs on first init (empty data dir).
      # REQUIRES "Preserve Repository During Deployment" (Configuration >
      # General) to be ON, or the checkout is gone by the time compose starts and
      # Docker silently creates an empty DIRECTORY at this path — postgres then
      # fails its init, never goes healthy, and takes the backend down with it.
      # If you'd rather let Coolify manage Postgres as its own resource (with
      # backups), drop this service and point DATABASE_URL at that resource.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  trade-staging-backend:
    image: ghcr.io/sairamcharanbethu/optionstrademonitoring-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    # No host `ports:` — the frontend's nginx proxies /api to
    # trade-staging-backend:3001 over the internal network.
    extra_hosts:
      # Keeps OLLAMA_URL=http://host.docker.internal:11434 reachable on Linux.
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL}
      BACKUP_DATABASE_URL: ${BACKUP_DATABASE_URL}
      PAPER_LEGACY_DATABASE_URL: ${PAPER_LEGACY_DATABASE_URL:-}
      REDIS_URL: redis://trade-staging-redis:6379
      JWT_SECRET: ${JWT_SECRET}
      # Internal port only. nginx.conf proxies /api to trade-staging-backend:3001
      # and the healthcheck below probes 3001, so both break if PORT is anything
      # else — leave it unset in Coolify unless you change nginx.conf too.
      PORT: ${PORT:-3001}
      N8N_ALERT_WEBHOOK_URL: ${N8N_ALERT_WEBHOOK_URL}
      MARKET_DATA_POLL_INTERVAL: ${MARKET_DATA_POLL_INTERVAL}
      SNAPTRADE_PENDING_SYNC_INTERVAL_SECONDS: ${SNAPTRADE_PENDING_SYNC_INTERVAL_SECONDS:-60}
      SMART_STOP_CONFIRMATION_MS: ${SMART_STOP_CONFIRMATION_MS:-45000}
      ENABLE_DEV_TRADING_TESTS: ${ENABLE_DEV_TRADING_TESTS:-false}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      AI_MODEL: ${AI_MODEL:-deepseek/deepseek-chat}
      MORNING_BRIEFING_SCHEDULE: ${MORNING_BRIEFING_SCHEDULE:-30 8 * * *}
      IBKR_HOST: ${IBKR_HOST:-host.docker.internal}
      IBKR_PORT: ${IBKR_PORT:-4001}
      IBKR_CLIENT_ID_MARKET_DATA: ${IBKR_CLIENT_ID_MARKET_DATA:-21}
      IBKR_CLIENT_ID_STREAM: ${IBKR_CLIENT_ID_STREAM:-22}
      IBKR_MARKET_DATA_TYPE: ${IBKR_MARKET_DATA_TYPE:-1}
      ZEROGEX_API_KEY: ${ZEROGEX_API_KEY:-}
      STRATEGY_DATA_DIR: /strategy-data/trade
      STRATEGY_MAX_TOTAL_DEBIT_DOLLARS: ${STRATEGY_MAX_TOTAL_DEBIT_DOLLARS:-500}
      STRATEGY_PREFERRED_CONTRACTS: ${STRATEGY_PREFERRED_CONTRACTS:-1}
      STRATEGY_MAX_CONTRACTS: ${STRATEGY_MAX_CONTRACTS:-1}
      STRATEGY_REDIS_CHANNEL: ${STRATEGY_REDIS_CHANNEL:-strategy:state-changed}
      STRATEGY_FILE_POLL_INTERVAL_MS: ${STRATEGY_FILE_POLL_INTERVAL_MS:-2000}
      STRATEGY_REDIS_WATCHDOG_INTERVAL_MS: ${STRATEGY_REDIS_WATCHDOG_INTERVAL_MS:-30000}
      STRIKEPILOT_CALENDAR_CONTACT: ${STRIKEPILOT_CALENDAR_CONTACT:-}
      VIX_TERM_STRUCTURE_MIN_RATIO: ${VIX_TERM_STRUCTURE_MIN_RATIO:-1.05}
    volumes:
      - strategy-data:/strategy-data
    depends_on:
      db:
        condition: service_healthy
      trade-staging-redis:
        condition: service_started
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5

  trade-staging-redis:
    image: redis:alpine
    restart: always
    # No host `ports:` — reached internally as trade-staging-redis:6379.
    networks:
      - default
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zerogex-prefetch:
    image: ghcr.io/sairamcharanbethu/optionstrademonitoring-strategy-engine:${IMAGE_TAG:-latest}
    build:
      context: ./strategy-engine
      dockerfile: Dockerfile
    restart: unless-stopped
    # No IBKR here — this service pulls the external zeroGEX API. It needs its
    # credentials in /data/trade/zerogex.env (mounted via the strategy-data vol).
    volumes:
      - strategy-data:/data
    command:
      - python3
      - zerogex_prefetch_service.py
      - --symbol
      - SPY
      - --mode
      - primary
      - --env-file
      - /data/trade/zerogex.env
      - --output-file
      - /data/trade/zerogex.json
      - --health-file
      - /data/trade/zerogex-health.json
      - --interval
      - "5"
      - --context-interval
      - "15"
      - --deep-interval
      - "30"
      - --slow-interval
      - "300"
      - --timeout
      - "10"
      - --slow-timeout
      - "45"
      - --auth-error-interval
      - "10"
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import json,time; h=json.load(open('/data/trade/zerogex-health.json')); assert h.get('status') != 'error' and time.time()-float(h['updated_at']) < 45\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  strategy-engine:
    image: ghcr.io/sairamcharanbethu/optionstrademonitoring-strategy-engine:${IMAGE_TAG:-latest}
    build:
      context: ./strategy-engine
      dockerfile: Dockerfile
    restart: unless-stopped
    extra_hosts:
      # Reaches the IB Gateway container's published host port (4001 live) via the
      # docker bridge. 127.0.0.1 from inside a container is the container itself,
      # so we resolve the host through host.docker.internal instead.
      - "host.docker.internal:host-gateway"
    environment:
      REDIS_URL: redis://trade-staging-redis:6379
      STRATEGY_REDIS_CHANNEL: ${STRATEGY_REDIS_CHANNEL:-strategy:state-changed}
    volumes:
      - strategy-data:/data
    command:
      - python3
      - trade_prefetch_service.py
      - --host
      # Host-run IB Gateway, reached via host.docker.internal (see extra_hosts).
      # Override via IBKR_HOST in the Coolify env if the gateway moves.
      - ${IBKR_HOST:-host.docker.internal}
      - --port
      - ${IBKR_PORT:-4001}
      - --client-id
      - ${IBKR_CLIENT_ID_STRATEGY:-23}
      - --symbols
      - SPY
      - QQQ
      - --cross-market-confirmation
      - shadow
      - --data-type
      - ${STRATEGY_IBKR_DATA_TYPE:-live}
      - --primary-gex-source
      - zerogex
      - --sscgex-enabled
      - "false"
      - --zerogex-enabled
      - "true"
      - --zerogex-structure-context
      - "true"
      - --zerogex-flow-context
      - "true"
      - --zerogex-session-levels
      - "true"
      - --zerogex-late-day-forced-flow
      - "true"
      - --local-gex-fallback
      - "false"
      - --option-max-total-debit-dollars
      - ${STRATEGY_MAX_TOTAL_DEBIT_DOLLARS:-500}
      - --option-preferred-contracts
      - ${STRATEGY_PREFERRED_CONTRACTS:-1}
      - --option-max-otm-steps
      - "6"
      - --option-min-abs-delta
      - "0.15"
      - --option-max-spread-pct
      - "5"
      - --wall-option-expiry-dte
      - ${STRATEGY_WALL_OPTION_EXPIRY_DTE:-0}
      - --paper-exit-target
      - "2"
      - --same-side-reentry-cooldown-seconds
      - "900"
      - --max-tracking-gap-seconds
      - "30"
      - --output-dir
      - /data/trade
      - --policy-file
      - /data/trade/policy.json
      - --gex-file
      - /data/disabled-sscgex.json
      - --heatmap-file
      - /data/disabled-heatmap.json
      - --zerogex-file
      - /data/trade/zerogex.json
      - --interval
      - "1"
    depends_on:
      zerogex-prefetch:
        condition: service_started
      trade-staging-redis:
        condition: service_started
      trade-staging-backend:
        condition: service_started
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import json,time; h=json.load(open('/data/trade/health.json')); assert h.get('status') != 'error' and h.get('connected') is True and time.time()-float(h['updated_at']) < 10\""]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s

  trade-staging-frontend:
    image: ghcr.io/sairamcharanbethu/optionstrademonitoring-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_APP_VERSION: ${VITE_APP_VERSION:-1.4.1}
        VITE_APP_BUILD_SHA: ${VITE_APP_BUILD_SHA:-}
        VITE_ENABLE_DEV_TRADING_TESTS: ${VITE_ENABLE_DEV_TRADING_TESTS:-false}
    restart: always
    # Declares the container port the proxy should route the domain at. No host
    # `ports:` on purpose — a published host port bypasses domain-based routing.
    expose:
      - "80"
    environment:
      # Coolify magic var: generates a domain + Traefik route + TLS.
      #
      # The identifier after `SERVICE_FQDN_` MUST name THIS compose service —
      # that is how Coolify decides which container to attach the generated
      # domain and Traefik router to. It was `SERVICE_FQDN_FRONTEND_80`, and
      # there is no service named `frontend`: Coolify minted a domain, bound it
      # to nothing, and reported a successful deploy while the URL resolved to
      # no backend at all.
      #
      # Hyphens in the service name become underscores here, and that forces us
      # to DROP the port suffix. Coolify's docs say to keep the hyphens when you
      # need a port (`SERVICE_URL_APPWRITE-SERVICE_3000`), but its env-key
      # validator rejects them outright: "The key must start with a letter or
      # underscore and may only contain letters, numbers, underscores, and
      # dots." With underscores a trailing `_80` is unparseable as a port, so it
      # is omitted — harmless, because nginx listens on 80 and the proxy already
      # assumes 80 when no port is given. `expose: 80` above is what tells
      # Coolify the container port.
      #
      # MUST be map form (key: value), not list form (- KEY) — Coolify merges its
      # own map-form env in, and a list here triggers a non-string-key parse error.
      SERVICE_FQDN_TRADE_STAGING_FRONTEND: ""
    depends_on:
      # `service_started`, not `service_healthy`. nginx serves a static SPA and
      # only needs the backend's DNS name to resolve for `proxy_pass` at config
      # load. Gating on backend health meant any db hiccup or failing `/ready`
      # left the frontend container never started — the whole site unreachable
      # rather than merely degraded.
      trade-staging-backend:
        condition: service_started
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

networks:
  # Single Coolify-managed network. All services join it and resolve each other
  # by service name. IB Gateway, once added to this stack (or reachable via the
  # address you set for IBKR_HOST), lives here too — no external network needed.
  default:

volumes:
  db-data:
  strategy-data:
