[package]
name = "se_kernel"
version = "0.1.0"
edition = "2021"
description = "Rust kernel for strategy-engine indicator math (bit-identical to the Python reference in signal_engine.py)"
license = "ISC"

[lib]
name = "se_kernel"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
