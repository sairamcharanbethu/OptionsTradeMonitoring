services:
  thetadata:
    build:
      context: ./thetadata
      dockerfile: Dockerfile
    image: optionstrademonitoring-thetadata:latest
    platform: ${THETADATA_PLATFORM:-linux/arm64}
    restart: unless-stopped
    environment:
      THETADATA_API_KEY: ${THETADATA_API_KEY}
      THETADATA_EMAIL: ${THETADATA_EMAIL:-${THETADATA_USERNAME:-}}
      THETADATA_PASSWORD: ${THETADATA_PASSWORD:-}
      THETADATA_DATAFRAME_TYPE: ${THETADATA_DATAFRAME_TYPE:-polars}
      THETADATA_MDDS_TYPE: ${THETADATA_MDDS_TYPE:-PROD}
      THETADATA_STREAM_POLL_SECONDS: ${THETADATA_STREAM_POLL_SECONDS:-2}
    ports:
      - "${PORT_THETADATA_REST:-25510}:25510"
      - "${PORT_THETADATA_STREAM:-25520}:25510"
    networks:
      ssmedia_ssmedia_net:
        aliases:
          - thetadata
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:25510/health', timeout=5).read()"]
      interval: 30s
      timeout: 5s
      retries: 5

networks:
  ssmedia_ssmedia_net:
    external: true
